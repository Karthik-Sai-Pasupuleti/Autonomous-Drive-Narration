x-narration: &narration
  image: autonomous-drive-narration:latest
  build:
    context: .
    dockerfile: docker/Dockerfile
  network_mode: host
  ipc: host
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    OLLAMA_HOST: ${OLLAMA_HOST:-http://localhost:11434}
    PULSE_SERVER: unix:/run/pulse/native
  env_file:
    - path: .env
      required: false
  volumes:
    - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:/run/pulse/native
    - ${HOME}/.config/pulse/cookie:/root/.config/pulse/cookie:ro

services:
  narration:
    <<: *narration
    command: >
      ros2 launch launch/vlm_narration.launch.py
      model:=${MODEL:-minicpm-v4.5:latest}
      backend:=${TTS_BACKEND:-auto}

  speaker:
    <<: *narration
    profiles: [manual]
    command: python src/drive-narration/speaker_node.py --ros-args -p backend:=${TTS_BACKEND:-auto}

  text:
    <<: *narration
    profiles: [manual]
    stdin_open: true
    tty: true
    command: python src/drive-narration/text_to_speaker_node.py
